openapi: 3.0.0
info:
  title: Exam SaaS Core API
  version: 1.0.0
  description: Detailed API documentation with examples for Core Modules (Auth, Companies, Plans, Subscriptions, Payments).
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Authenticate a user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: admin@examguard.com
                password:
                  type: string
                  example: "securepassword123"
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              example:
                success: true
                message: Login successful
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refreshToken: "dGhpcy1pcy1hLXJlZnJlc2gtdG9rZW4..."
                  user:
                    id: "60d0fe4f5311236168a109ca"
                    name: "John Doe"
                    email: "admin@examguard.com"
                    role: "Master Admin"

  /auth/profile:
    get:
      summary: Get current user profile
      tags: [Auth]
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              example:
                success: true
                data:
                  id: "60d0fe4f5311236168a109ca"
                  name: "John Doe"
                  email: "admin@examguard.com"
                  role: "Master Admin"
                  permissions: ["manage_companies", "manage_plans"]

  /companies:
    get:
      summary: List all companies (Paginated)
      tags: [Companies]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: A list of companies
          content:
            application/json:
              example:
                success: true
                data:
                  data:
                    - _id: "60d100405311236168a109cb"
                      companyName: "EduTech Corp"
                      companyEmail: "contact@edutech.com"
                      companyPhone: "+919876543210"
                      isActive: true
                      subscriptionPlan: "PROFESSIONAL"
                      status: "Approved"
                  page: 1
                  limit: 10
                  total: 45
                  totalPages: 5

    post:
      summary: Register a new company
      tags: [Companies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName: { type: string, example: "New Institute" }
                companyEmail: { type: string, example: "info@institute.com" }
                companyPhone: { type: string, example: "+919876500000" }
                address: { type: string, example: "123 Education St, Delhi" }
      responses:
        '201':
          description: Company created successfully
          content:
            application/json:
              example:
                success: true
                message: Company registered successfully
                data:
                  _id: "60d100405311236168a109cc"
                  companyName: "New Institute"

  /companies/{id}/status:
    patch:
      summary: Toggle company active status
      tags: [Companies]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: boolean, example: false }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              example:
                success: true
                message: Company status updated successfully

  /payments/create-order:
    post:
      summary: Create a new Razorpay order
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyId: { type: string, example: "60d100405311236168a109cc" }
                planId: { type: string, example: "PROFESSIONAL" }
                amount: { type: number, example: 35000 }
      responses:
        '200':
          description: Order created
          content:
            application/json:
              example:
                success: true
                data:
                  orderId: "order_KjU8xQw1yZ"
                  payment:
                    _id: "60d105215311236168a109cd"
                    amount: 35000
                    status: "Pending"

  /companies/{id}/verify-payment:
    post:
      summary: Verify Razorpay payment signature
      tags: [Payments, Companies]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                razorpay_order_id: { type: string, example: "order_KjU8xQw1yZ" }
                razorpay_payment_id: { type: string, example: "pay_KjU8zQw1yZ" }
                razorpay_signature: { type: string, example: "a4c28..." }
      responses:
        '200':
          description: Payment verified
          content:
            application/json:
              example:
                success: true
                message: Payment verified successfully
                data:
                  _id: "60d100405311236168a109cc"
                  subscriptionPlan: "PROFESSIONAL"

  /companies/{id}/subscription:
    patch:
      summary: Update company subscription directly
      tags: [Subscriptions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subscriptionPlan: { type: string, example: "ENTERPRISE" }
                subscriptionStartDate: { type: string, format: date-time }
                subscriptionEndDate: { type: string, format: date-time }
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              example:
                success: true
                message: Subscription updated successfully
